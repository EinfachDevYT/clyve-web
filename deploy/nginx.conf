# Hauptseite: clyve.dev  →  Webroot /var/www/clyve-web/public
server {
    listen 443 ssl http2;
    server_name clyve.dev www.clyve.dev;
    root /var/www/clyve-web/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/clyve.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clyve.dev/privkey.pem;

    client_max_body_size 64k;
    server_tokens off;

    location ~ /\. { deny all; }
    location ~* \.(css|js|svg|png|jpg|webp|woff2)$ { expires 7d; access_log off; try_files $uri =404; }
    location / { try_files $uri /index.php$is_args$args; }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ \.php$ { return 404; }
}

# Mitarbeiterbereich: team.clyve.dev  →  Webroot /var/www/clyve-web/staff
server {
    listen 443 ssl http2;
    server_name team.clyve.dev;
    root /var/www/clyve-web/staff;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/team.clyve.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/team.clyve.dev/privkey.pem;

    client_max_body_size 64k;
    server_tokens off;

    # Optional zusätzlich auf Server-Ebene absichern:
    # allow 203.0.113.10;
    # deny all;

    location ~ /\. { deny all; }
    location ~* \.(css|js|svg|png|jpg|webp|woff2)$ { expires 7d; access_log off; try_files $uri =404; }
    location / { try_files $uri /index.php$is_args$args; }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ \.php$ { return 404; }
}

server {
    listen 80;
    server_name clyve.dev www.clyve.dev team.clyve.dev;
    return 301 https://$host$request_uri;
}
