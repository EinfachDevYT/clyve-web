# /etc/nginx/sites-available/clyve.dev
server {
    listen 80;
    listen [::]:80;
    server_name clyve.dev;

    root /var/www/clyve-web/public;
    index index.php;

    access_log /var/log/nginx/clyve.access.log;
    error_log  /var/log/nginx/clyve.error.log;

    client_max_body_size 64k;
    server_tokens off;
    charset utf-8;

    location ~ /\.          { deny all; }
    location = /favicon.ico { access_log off; log_not_found off; }

    location ~* \.(css|js|svg|png|jpe?g|webp|ico|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ \.php$ { return 404; }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.clyve.dev;
    return 301 https://clyve.dev$request_uri;
}
