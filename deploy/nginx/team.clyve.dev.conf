# /etc/nginx/sites-available/team.clyve.dev
server {
    listen 80;
    listen [::]:80;
    server_name team.clyve.dev;

    root /var/www/clyve-web/staff;
    index index.php;

    access_log /var/log/nginx/clyve-team.access.log;
    error_log  /var/log/nginx/clyve-team.error.log;

    client_max_body_size 64k;
    server_tokens off;
    charset utf-8;

    # Optional: nur bestimmte IPs zulassen (zusätzlich zu staff_ip_allowlist in der Config)
    # allow 203.0.113.10;
    # deny all;

    location ~ /\.          { deny all; }
    location = /favicon.ico { access_log off; log_not_found off; }

    location ~* \.(css|js|svg|png|jpe?g|webp|ico|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ \.php$ { return 404; }
}
